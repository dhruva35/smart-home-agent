[pytest]
# Register custom markers so pytest doesn't warn about unknown markers.
# See: https://docs.pytest.org/en/stable/how-to/mark.html#registering-marks
markers =
    red_team: Adversarial attack tests that require live services and make real LLM API calls.
              Excluded from normal CI runs. Run manually with: pytest -m red_team -v -s

# Exclude red_team tests from the default run.
# The normal `pytest` invocation (used in CI) skips them automatically.
# To run only red-team tests: pytest -m red_team -v -s
addopts = -m "not red_team"
